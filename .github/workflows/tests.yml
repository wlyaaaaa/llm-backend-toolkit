name: toolkit-contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  aicli-consumer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: wlyaaaaa/ai-cli-profile-manager
          path: aicli
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: |
          python -m pip install -e ./toolkit
          $env:LLM_TOOLKIT_CONTRACT_AICLI_ROOT = (Resolve-Path ./aicli).Path
          python -m unittest discover -s ./toolkit/tests -p test_aicli_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
