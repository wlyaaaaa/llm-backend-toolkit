name: toolkit-contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  aicli-consumer:
    runs-on: windows-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: wlyaaaaa/ai-cli-profile-manager
          path: aicli
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - shell: pwsh
        run: |
          python -m pip install -e ./toolkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: github.event_name != 'schedule'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE '_toolkit-ci-temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $env:TMPDIR = $testTemp
          $OutputEncoding = [Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $env:LLM_TOOLKIT_CONTRACT_AICLI_ROOT = (Resolve-Path ./aicli).Path
          python -m unittest discover -s ./toolkit/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $env:LLM_TOOLKIT_CONTRACT_AICLI_ROOT = (Resolve-Path ./aicli).Path
          python -m unittest discover -s ./toolkit/tests -p test_aicli_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
