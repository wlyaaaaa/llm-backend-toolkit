[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-backend-toolkit"
version = "0.1.0"
description = "A compact, result-observable toolkit for explicit cloud and local LLM calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "wlyaaaaa" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
llm-backend-toolkit = "llm_backend_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
